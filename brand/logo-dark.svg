<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320">
  <svg x="0" y="0" width="320" height="320" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".5" stop-color="#d14dff"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="gk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="gk-glow" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#gk-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gk-glow)"/>
  <!-- card behind -->
  <rect x="118" y="132" width="300" height="190" rx="30" fill="#fff" opacity=".32" transform="rotate(-13 268 227)"/>
  <!-- front gift card -->
  <g transform="rotate(-5 256 300)">
    <rect x="92" y="200" width="328" height="206" rx="32" fill="#fff"/>
    <rect x="178" y="200" width="40" height="206" fill="url(#gk-gold)"/>
    <rect x="262" y="318" width="118" height="16" rx="8" fill="#e9e2ff"/>
    <rect x="262" y="350" width="78" height="16" rx="8" fill="#e9e2ff"/>
    <!-- bow -->
    <g fill="none" stroke="url(#gk-gold)" stroke-width="20" stroke-linecap="round">
      <path d="M198 200 C 150 196, 128 140, 160 128 C 184 120, 196 162, 198 200 Z"/>
      <path d="M198 200 C 246 196, 268 140, 236 128 C 212 120, 200 162, 198 200 Z"/>
    </g>
    <circle cx="198" cy="200" r="20" fill="url(#gk-gold)"/>
  </g>
  </svg>
  <text x="372" y="190" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="132" letter-spacing="-3" fill="#ffffff">Gift Keeper</text>
  <text x="378" y="262" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="40" letter-spacing="1" fill="#cbbcff">Never lose a gift card again.</text>
</svg>
